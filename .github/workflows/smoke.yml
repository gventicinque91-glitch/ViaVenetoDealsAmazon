name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py app_v2.py app_v3.py app_v4.py app_v5.py app_v6.py app_v7.py app_v8.py app_v9.py app_v10.py app_v11.py app_v12.py app_v13.py app_v14.py app_v15.py run_report_once.py integration_check.py price_parser_check.py generate_session.py bot_poller.py bot_listener.py
      - run: python -c "import app_v15; import run_report_once; import bot_poller; import bot_listener; print('PYTHON_IMPORT_OK')"
      - run: python price_parser_check.py
      - run: node --check worker/src/index.js
