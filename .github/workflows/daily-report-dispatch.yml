name: Daily 20:00 report dispatcher

on:
  schedule:
    - cron: '0 18,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch only at 20:00 Europe/Rome
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Europe/Rome',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
            }).formatToParts(now);
            const value = (type) => parts.find((p) => p.type === type)?.value || '';
            const localHour = Number(value('hour'));
            const localMinute = Number(value('minute'));
            core.info(`Europe/Rome now: ${String(localHour).padStart(2, '0')}:${String(localMinute).padStart(2, '0')}`);

            if (context.eventName === 'schedule' && localHour !== 20) {
              core.info('Not 20:00 in Europe/Rome; skipping this UTC schedule slot.');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'report.yml',
              per_page: 10,
            });
            const active = runs.data.workflow_runs.find((r) => ['queued', 'in_progress'].includes(r.status));
            if (active) {
              core.info(`A report is already active: run ${active.id} (${active.status}).`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'report.yml',
              ref: 'main',
              inputs: {
                chat_id: '',
                status_message_id: '',
                cutoff: now.toISOString(),
                requested_at: now.toISOString(),
                origin: 'scheduled',
              },
            });
            core.info('Scheduled 20:00 report dispatched.');
